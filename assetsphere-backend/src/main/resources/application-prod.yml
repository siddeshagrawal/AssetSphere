spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
assetsphere:
  jwt:
    secret: ${ASSETSPHERE_JWT_SECRET:?ASSETSPHERE_JWT_SECRET must be configured}
  storage:
    minio:
      enabled: false
  ai:
    enabled: ${ASSETSPHERE_AI_ENABLED:false}
logging:
  level:
    root: INFO
    com.assetsphere: INFO
