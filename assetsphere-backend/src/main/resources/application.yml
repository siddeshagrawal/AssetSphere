spring:
  application:
    name: assetsphere-backend
  modulith:
    detection-strategy: explicitly-annotated
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: ${ASSETSPHERE_ASSET_UPLOAD_MAX_FILE_SIZE:25MB}
      max-request-size: ${ASSETSPHERE_ASSET_UPLOAD_MAX_FILE_SIZE:25MB}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      repositories:
        enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    listener:
      ack-mode: record
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: ${ASSETSPHERE_PROCESSING_CONSUMER_GROUP:assetsphere-processing}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  ai:
    model:
      chat: ${ASSETSPHERE_AI_SPRING_CHAT_MODEL:openai}
      embedding: ${ASSETSPHERE_AI_SPRING_EMBEDDING_MODEL:none}
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      embedding:
        options:
          model: ${ASSETSPHERE_AI_EMBEDDING_MODEL:text-embedding-3-small}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_TLS:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId}] %logger{36} - %msg%n"
assetsphere:
  ops:
    dlt:
      enabled: ${ASSETSPHERE_DLT_OPS_ENABLED:true}
      max-inspection-records: ${ASSETSPHERE_DLT_OPS_MAX_RECORDS:100}
  cors:
    allowed-origins: ${ASSETSPHERE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${ASSETSPHERE_JWT_SECRET:}
    access-token-expiration-seconds: ${ASSETSPHERE_ACCESS_TOKEN_TTL_SECONDS:900}
  auth:
    refresh-token-ttl: ${ASSETSPHERE_REFRESH_TOKEN_TTL:PT168H}
    login-max-failures: ${ASSETSPHERE_LOGIN_MAX_FAILURES:5}
    lock-duration: ${ASSETSPHERE_LOCK_DURATION:PT15M}
    google:
      enabled: ${GOOGLE_OAUTH_ENABLED:false}
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      frontend-success-url: ${GOOGLE_FRONTEND_SUCCESS_URL:http://localhost:5173/oauth/callback}
      frontend-failure-url: ${GOOGLE_FRONTEND_FAILURE_URL:http://localhost:5173/login}
  notification:
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    email:
      enabled: ${EMAIL_ENABLED:false}
      time-zone: ${EMAIL_TIME_ZONE:Asia/Kolkata}
      from: ${EMAIL_FROM:}
  security:
    invitation-expiration-seconds: ${ASSETSPHERE_INVITATION_EXPIRATION_SECONDS:604800}
  asset:
    upload:
      max-file-size: ${ASSETSPHERE_ASSET_UPLOAD_MAX_FILE_SIZE:25MB}
      allowed-mime-types:
        - application/pdf
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - text/plain
        - text/markdown
        - text/x-markdown
        - text/csv
        - application/csv
        - application/vnd.ms-excel
        - application/json
        - text/json
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        - application/vnd.openxmlformats-officedocument.presentationml.presentation
        - image/png
        - image/jpeg
        - image/webp
        - video/mp4
        - video/webm
      allow-other-types: false
      idempotency-in-progress-ttl: PT15M
      idempotency-failed-ttl: PT15M
      idempotency-completed-ttl: PT24H
      rate-limit:
        permits: ${ASSETSPHERE_ASSET_UPLOAD_RATE_LIMIT_PERMITS:20}
        window: ${ASSETSPHERE_ASSET_UPLOAD_RATE_LIMIT_WINDOW:PT1M}
  billing:
    payment-mode: ${ASSETSPHERE_PAYMENT_MODE:STRIPE}
    enterprise:
      max-assets: ${ASSETSPHERE_BILLING_ENTERPRISE_MAX_ASSETS:10000}
      max-storage: ${ASSETSPHERE_BILLING_ENTERPRISE_MAX_STORAGE:200GB}
      max-members: ${ASSETSPHERE_BILLING_ENTERPRISE_MAX_MEMBERS:500}
      monthly-ai-insights: ${ASSETSPHERE_BILLING_ENTERPRISE_AI_INSIGHTS:5000}
      monthly-ask-requests: ${ASSETSPHERE_BILLING_ENTERPRISE_ASK_REQUESTS:20000}
      monthly-evolution-comparisons: ${ASSETSPHERE_BILLING_ENTERPRISE_EVOLUTION_COMPARISONS:2500}
      monthly-semantic-searches: ${ASSETSPHERE_BILLING_ENTERPRISE_SEMANTIC_SEARCHES:200000}
      monthly-quiz-generations: ${ASSETSPHERE_BILLING_ENTERPRISE_QUIZ_GENERATIONS:2000}
      ocr-enabled: true
      video-transcription-enabled: true
      full-audit-enabled: true
    payment:
      pro-price-minor: ${ASSETSPHERE_BILLING_PRO_PRICE_MINOR:99900}
      currency: ${ASSETSPHERE_BILLING_CURRENCY:INR}
      attempt-feedback-window: ${ASSETSPHERE_BILLING_ATTEMPT_FEEDBACK_WINDOW:PT15M}
      pending-checkout-window: ${ASSETSPHERE_BILLING_PENDING_CHECKOUT_WINDOW:PT24H}
    stripe:
      enabled: ${STRIPE_ENABLED:true}
      secret-key: ${STRIPE_SECRET_KEY:}
      publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      pro-price-id: ${STRIPE_PRO_PRICE_ID:}
      base-url: ${STRIPE_BASE_URL:https://api.stripe.com}
    local-razorpay:
      enabled: ${ASSETSPHERE_LOCAL_RAZORPAY_ENABLED:false}
      variant: ${LOCAL_RAZORPAY_VARIANT:}
      key-id: ${LOCAL_RAZORPAY_KEY_ID:}
      key-secret: ${LOCAL_RAZORPAY_KEY_SECRET:}
      webhook-secret: ${LOCAL_RAZORPAY_WEBHOOK_SECRET:}
      base-url: ${LOCAL_RAZORPAY_BASE_URL:http://localhost:8082}
      poll-confirmation-enabled: ${ASSETSPHERE_LOCAL_RAZORPAY_POLL_CONFIRMATION_ENABLED:false}
      non-terminal-status-cache-ttl: ${ASSETSPHERE_LOCAL_RAZORPAY_NON_TERMINAL_CACHE_TTL:PT3S}
      terminal-status-cache-ttl: ${ASSETSPHERE_LOCAL_RAZORPAY_TERMINAL_CACHE_TTL:PT30S}
    free:
      max-assets: ${ASSETSPHERE_BILLING_FREE_MAX_ASSETS:25}
      max-storage: ${ASSETSPHERE_BILLING_FREE_MAX_STORAGE:250MB}
      monthly-ai-insights: ${ASSETSPHERE_BILLING_FREE_AI_INSIGHTS:10}
      monthly-ask-requests: ${ASSETSPHERE_BILLING_FREE_ASK_REQUESTS:50}
      monthly-evolution-comparisons: ${ASSETSPHERE_BILLING_FREE_EVOLUTION_COMPARISONS:5}
      monthly-semantic-searches: ${ASSETSPHERE_BILLING_FREE_SEMANTIC_SEARCHES:500}
      monthly-quiz-generations: ${ASSETSPHERE_BILLING_FREE_QUIZ_GENERATIONS:3}
    pro:
      max-assets: ${ASSETSPHERE_BILLING_PRO_MAX_ASSETS:1000}
      max-storage: ${ASSETSPHERE_BILLING_PRO_MAX_STORAGE:20GB}
      monthly-ai-insights: ${ASSETSPHERE_BILLING_PRO_AI_INSIGHTS:500}
      monthly-ask-requests: ${ASSETSPHERE_BILLING_PRO_ASK_REQUESTS:2000}
      monthly-evolution-comparisons: ${ASSETSPHERE_BILLING_PRO_EVOLUTION_COMPARISONS:250}
      monthly-semantic-searches: ${ASSETSPHERE_BILLING_PRO_SEMANTIC_SEARCHES:20000}
      monthly-quiz-generations: ${ASSETSPHERE_BILLING_PRO_QUIZ_GENERATIONS:200}
    cache:
      metadata-ttl: ${ASSETSPHERE_ASSET_METADATA_CACHE_TTL:PT5M}
  processing:
    max-processing-file-size: ${ASSETSPHERE_PROCESSING_MAX_FILE_SIZE:25MB}
    max-retained-text-characters: ${ASSETSPHERE_PROCESSING_MAX_TEXT_CHARACTERS:1000000}
    outbox-poll-interval: ${ASSETSPHERE_OUTBOX_POLL_INTERVAL:PT1S}
    outbox-batch-size: ${ASSETSPHERE_OUTBOX_BATCH_SIZE:50}
    outbox-lease-duration: ${ASSETSPHERE_OUTBOX_LEASE_DURATION:PT30S}
    outbox-max-retries: ${ASSETSPHERE_OUTBOX_MAX_RETRIES:8}
    outbox-initial-retry-delay: ${ASSETSPHERE_OUTBOX_INITIAL_RETRY_DELAY:PT1S}
    outbox-max-retry-delay: ${ASSETSPHERE_OUTBOX_MAX_RETRY_DELAY:PT5M}
    kafka-send-timeout: ${ASSETSPHERE_KAFKA_SEND_TIMEOUT:PT10S}
    topics:
      asset-uploaded: ${ASSETSPHERE_ASSET_UPLOADED_TOPIC:assets.uploaded.v1}
      asset-uploaded-dlt: ${ASSETSPHERE_ASSET_UPLOADED_DLT_TOPIC:assets.uploaded.v1.DLT}
    consumer:
      group-id: ${ASSETSPHERE_PROCESSING_CONSUMER_GROUP:assetsphere-processing}
      max-attempts: ${ASSETSPHERE_PROCESSING_MAX_ATTEMPTS:4}
      initial-backoff: ${ASSETSPHERE_PROCESSING_INITIAL_BACKOFF:PT1S}
      max-backoff: ${ASSETSPHERE_PROCESSING_MAX_BACKOFF:PT15S}
      processing-lock-lease: ${ASSETSPHERE_PROCESSING_LOCK_LEASE:PT30S}
  ai:
    enabled: ${ASSETSPHERE_AI_ENABLED:false}
    provider: ${ASSETSPHERE_AI_PROVIDER:OPENAI}
    model: ${ASSETSPHERE_AI_MODEL:gpt-4o-mini}
    models:
      - provider: OPENAI
        model-id: ${ASSETSPHERE_AI_MODEL:gpt-4o-mini}
        display-name: ${ASSETSPHERE_AI_MODEL_DISPLAY_NAME:OpenAI economical}
        capabilities: [ASK, INTELLIGENCE, EVOLUTION, QUIZ]
        minimum-plan: FREE
        enabled: true
        default-model: true
      - provider: OPENAI
        model-id: ${ASSETSPHERE_AI_PRO_MODEL:gpt-4o}
        display-name: ${ASSETSPHERE_AI_PRO_MODEL_DISPLAY_NAME:OpenAI advanced}
        capabilities: [ASK, INTELLIGENCE, EVOLUTION, QUIZ]
        minimum-plan: PRO
        enabled: ${ASSETSPHERE_AI_PRO_MODEL_ENABLED:false}
        default-model: ${ASSETSPHERE_AI_PRO_MODEL_DEFAULT:false}
      - provider: OPENAI
        model-id: ${ASSETSPHERE_AI_ENTERPRISE_MODEL:gpt-4.1}
        display-name: ${ASSETSPHERE_AI_ENTERPRISE_MODEL_DISPLAY_NAME:OpenAI enterprise}
        capabilities: [ASK, INTELLIGENCE, EVOLUTION, QUIZ]
        minimum-plan: ENTERPRISE
        enabled: ${ASSETSPHERE_AI_ENTERPRISE_MODEL_ENABLED:false}
        default-model: ${ASSETSPHERE_AI_ENTERPRISE_MODEL_DEFAULT:false}
    max-input-characters: ${ASSETSPHERE_AI_MAX_INPUT_CHARACTERS:24000}
    temperature: ${ASSETSPHERE_AI_TEMPERATURE:0.1}
    max-tags: ${ASSETSPHERE_AI_MAX_TAGS:8}
    max-key-points: ${ASSETSPHERE_AI_MAX_KEY_POINTS:6}
    max-summary-characters: ${ASSETSPHERE_AI_MAX_SUMMARY_CHARACTERS:2000}
    max-tag-characters: ${ASSETSPHERE_AI_MAX_TAG_CHARACTERS:80}
    max-key-point-characters: ${ASSETSPHERE_AI_MAX_KEY_POINT_CHARACTERS:500}
    max-rag-sources: ${ASSETSPHERE_RAG_MAX_SOURCES:8}
    max-rag-context-characters: ${ASSETSPHERE_RAG_MAX_CONTEXT_CHARACTERS:16000}
    max-rag-source-characters: ${ASSETSPHERE_RAG_MAX_SOURCE_CHARACTERS:2500}
    media:
      ocr-enabled: ${ASSETSPHERE_AI_OCR_ENABLED:false}
      transcription-enabled: ${ASSETSPHERE_AI_TRANSCRIPTION_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      vision-model: ${ASSETSPHERE_AI_VISION_MODEL:gpt-4o-mini}
      transcription-model: ${ASSETSPHERE_AI_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}
      max-image-size: ${ASSETSPHERE_AI_OCR_MAX_IMAGE_SIZE:10MB}
      max-video-size: ${ASSETSPHERE_AI_TRANSCRIPTION_MAX_VIDEO_SIZE:25MB}
    processing-lock-lease: ${ASSETSPHERE_AI_PROCESSING_LOCK_LEASE:PT2M}
    topics:
      asset-ready: ${ASSETSPHERE_ASSET_READY_FOR_INTELLIGENCE_TOPIC:assets.ready-for-intelligence.v1}
      asset-ready-dlt: ${ASSETSPHERE_ASSET_READY_FOR_INTELLIGENCE_DLT_TOPIC:assets.ready-for-intelligence.v1.DLT}
    consumer:
      group-id: ${ASSETSPHERE_INTELLIGENCE_CONSUMER_GROUP:assetsphere-intelligence}
      max-attempts: ${ASSETSPHERE_INTELLIGENCE_MAX_ATTEMPTS:4}
      initial-backoff: ${ASSETSPHERE_INTELLIGENCE_INITIAL_BACKOFF:PT1S}
      max-backoff: ${ASSETSPHERE_INTELLIGENCE_MAX_BACKOFF:PT15S}
    embedding:
      enabled: ${ASSETSPHERE_AI_EMBEDDING_ENABLED:false}
      model: ${ASSETSPHERE_AI_EMBEDDING_MODEL:text-embedding-3-small}
      dimension: ${ASSETSPHERE_AI_EMBEDDING_DIMENSION:1536}
      batch-size: ${ASSETSPHERE_AI_EMBEDDING_BATCH_SIZE:16}
      chunk-size: ${ASSETSPHERE_AI_CHUNK_SIZE:1000}
      chunk-overlap: ${ASSETSPHERE_AI_CHUNK_OVERLAP:160}
      max-chunks-per-document: ${ASSETSPHERE_AI_MAX_CHUNKS_PER_DOCUMENT:100}
      processing-lock-lease: ${ASSETSPHERE_AI_SEMANTIC_LOCK_LEASE:PT2M}
      semantic-search-limit: ${ASSETSPHERE_SEMANTIC_SEARCH_LIMIT:20}
      minimum-similarity: ${ASSETSPHERE_SEMANTIC_MINIMUM_SIMILARITY:0.35}
      semantic-search-rate-limit:
        permits: ${ASSETSPHERE_SEMANTIC_SEARCH_RATE_LIMIT_PERMITS:20}
        window: ${ASSETSPHERE_SEMANTIC_SEARCH_RATE_LIMIT_WINDOW:PT1M}
      rag-rate-limit:
        permits: ${ASSETSPHERE_RAG_RATE_LIMIT_PERMITS:10}
        window: ${ASSETSPHERE_RAG_RATE_LIMIT_WINDOW:PT1M}
      topics:
        asset-ready: assets.ready-for-semantic-index.v1
      consumer:
        group-id: assetsphere-semantic-indexer
