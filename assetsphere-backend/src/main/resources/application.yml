spring:
  application:
    name: assetsphere-backend
  profiles:
    default: dev
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    listener:
      ack-mode: manual
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
    consumer:
      group-id: assetsphere-monolith
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.assetsphere
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId}] %logger{36} - %msg%n"
assetsphere:
  jwt:
    secret: ${ASSETSPHERE_JWT_SECRET:}
    access-token-expiration-seconds: ${ASSETSPHERE_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-expiration-seconds: ${ASSETSPHERE_REFRESH_TOKEN_TTL_SECONDS:604800}
  security:
    login-max-failures: ${ASSETSPHERE_LOGIN_MAX_FAILURES:5}
    lock-duration-seconds: ${ASSETSPHERE_LOCK_DURATION_SECONDS:900}
    invitation-expiration-seconds: ${ASSETSPHERE_INVITATION_EXPIRATION_SECONDS:604800}
  ai:
    enabled: false
